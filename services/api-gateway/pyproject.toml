[project]
name = "api-gateway"
version = "1.0.0"
description = "API gateway and reverse proxy for Synapse platform"
requires-python = ">=3.11"
dependencies = [
    "shared",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
shared = { workspace = true }
