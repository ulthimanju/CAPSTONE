[project]
name = "cpa-platform"
version = "1.0.0"
description = "Synapse platform workspace root"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = [
    "shared",
    "services/identity-service",
    "services/workspace-service",
    "services/document-service",
    "services/rag-service",
    "services/ai-service",
    "services/notification-service",
    "services/api-gateway",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "T201", # print() statement lint check - disallow print() in production
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
python_files = "test_*.py"
pythonpath = ["shared"]
testpaths = ["shared/tests"]
