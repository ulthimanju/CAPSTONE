[project]
name = "document-service"
version = "1.0.0"
description = "Document ingestion and parsing microservice for Synapse platform"
requires-python = ">=3.11"
dependencies = [
    "shared",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.0.0",
    "alembic>=1.13.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.9",
    "boto3>=1.34.0",
    "llama-parse>=0.4.0",
    "llama-cloud>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
shared = { workspace = true }
