[project]
name = "notification-service"
version = "1.0.0"
description = "Event-driven notification microservice for Synapse platform"
requires-python = ">=3.11"
dependencies = [
    "shared",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.0.0",
    "aio-pika>=9.4.0",
    "redis>=5.0.0",
    "motor>=3.5.0",
    "pymongo>=4.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
shared = { workspace = true }
