[project]
name = "rag-service"
version = "1.0.0"
description = "Retrieval-Augmented Generation microservice for Synapse platform"
requires-python = ">=3.11"
dependencies = [
    "shared",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.0.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    "google-genai>=1.0.0",
    "chromadb>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
shared = { workspace = true }
