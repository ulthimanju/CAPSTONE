# ─────────────────────────────────────────────────────────────
# SYNAPSE Microservices Infrastructure
# ─────────────────────────────────────────────────────────────

networks:
  synapse-network:
    name: synapse_network
    driver: bridge

services:

  # ── Databases & Message Brokers ────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: synapse_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_MULTIPLE_DATABASES: identity_db,workspace_db,document_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
      - ./docker/init-identity-triggers.sql:/docker-entrypoint-initdb.d/init-identity-triggers.sql
    ports:
      - "5432:5432"
    networks:
      - synapse-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: synapse_redis
    ports:
      - "6379:6379"
    networks:
      - synapse-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: synapse_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: rabbit
      RABBITMQ_DEFAULT_PASS: rabbitpassword
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - synapse-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: synapse_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongopassword
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - synapse-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: synapse_pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: rag_db
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - synapse-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # ── Microservices ──────────────────────────────────────────

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    container_name: synapse_identity_service
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env.common
      - services/identity-service/.env
    ports:
      - "8001:8000"
    networks:
      - synapse-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  workspace-service:
    build:
      context: .
      dockerfile: services/workspace-service/Dockerfile
    container_name: synapse_workspace_service
    env_file:
      - .env.common
      - services/workspace-service/.env
    ports:
      - "8002:8000"
    networks:
      - synapse-network
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  document-service:
    build:
      context: .
      dockerfile: services/document-service/Dockerfile
    container_name: synapse_document_service
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env.common
      - services/document-service/.env
    ports:
      - "8003:8000"
    networks:
      - synapse-network
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  rag-service:
    build:
      context: .
      dockerfile: services/rag-service/Dockerfile
    container_name: synapse_rag_service
    env_file:
      - .env.common
      - services/rag-service/.env
    ports:
      - "8004:8000"
    networks:
      - synapse-network
    depends_on:
      pgvector:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    container_name: synapse_ai_service
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env.common
      - services/ai-service/.env
    ports:
      - "8005:8000"
    networks:
      - synapse-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: synapse_notification_service
    env_file:
      - .env.common
      - services/notification-service/.env
    ports:
      - "8006:8000"
    networks:
      - synapse-network
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: synapse_api_gateway
    env_file:
      - .env.common
      - services/api-gateway/.env
    ports:
      - "8000:8000"
    networks:
      - synapse-network
    depends_on:
      - identity-service
      - workspace-service
      - document-service
      - rag-service
      - ai-service
      - notification-service
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  web-app:
    build:
      context: ./web-app
      dockerfile: Dockerfile
    container_name: synapse_web_app
    environment:
      - VITE_API_GATEWAY_URL=http://api-gateway:8000
      - VITE_API_BASE_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    ports:
      - "80:5173"
      - "5173:5173"
    networks:
      - synapse-network
    volumes:
      - ./web-app:/app
      - /app/node_modules
    depends_on:
      - api-gateway
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

# ─────────────────────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  pgvector_data:
  mongo_data:
